name: Pronóstico WindGuru
# Actualiza site/data/pronostico.json 3 veces al día (5:47, 11:47 y 17:47 hora de Lima).
on:
  schedule:
    - cron: '47 10,16,22 * * *'   # UTC
  workflow_dispatch:               # botón "Run workflow" para actualizar a mano
permissions:
  contents: write
jobs:
  pronostico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar pronóstico
        run: python3 tools/windguru.py site/data/pronostico.json
      - name: Guardar si cambió
        run: |
          git config user.name "cpw-bot"
          git config user.email "cpw-bot@users.noreply.github.com"
          git add site/data/pronostico.json
          git diff --cached --quiet || (git commit -m "Pronóstico $(date -u +%Y-%m-%dT%H:%M)" && git push)
